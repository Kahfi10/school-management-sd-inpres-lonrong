# ==============================================================================
# Konfigurasi Nginx Production - SD Inpres Lonrong
# Path: /etc/nginx/sites-available/sdlonrong
# Symlink: /etc/nginx/sites-enabled/sdlonrong
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_SUBDOMAIN.duckdns.org; # Ganti dengan domain DuckDNS Anda

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect seluruh HTTP traffic ke HTTPS (diaktifkan otomatis setelah certbot)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_SUBDOMAIN.duckdns.org; # Ganti dengan domain DuckDNS Anda

    # Lokasi file build dist aplikasi
    root /var/www/sdlonrong/dist;
    index index.html;

    # SSL Certificates (dihasilkan oleh certbot atau Cloudflare Origin Cert)
    ssl_certificate /etc/letsencrypt/live/YOUR_SUBDOMAIN.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_SUBDOMAIN.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gzip Compression untuk akses super cepat di jaringan seluler 4G/3G sekolah
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security Headers (OWASP & Apple Security Standard)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*; connect-src 'self' blob:; frame-ancestors 'none';" always;

    # Static Assets Caching (Vite hash files: immutable 1 tahun)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html no-cache (agar pembaruan aplikasi langsung terdeteksi)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Blok file tersembunyi seperti .git, .env
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
