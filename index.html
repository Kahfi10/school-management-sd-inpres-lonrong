    <meta name="referrer" content="strict-origin-when-cross-origin" />

          <button class="nav-item" data-nav="siswa">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            </span>
            <span>Siswa & Alumni</span>
          </button>

          <button class="nav-item" data-nav="kepegawaian">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </span>
            <span>Kepegawaian & Beban</span>

            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>

            <span>Inventaris Sarpras</span>
          </button>

          <button class="nav-item" data-nav="jurnal">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>

          </button>

          <div class="nav-section-label">Layanan Depan</div>

          <button class="nav-item" data-nav="bukutamu">
            <span class="nav-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </span>
            <span>Buku Tamu Digital</span>
            <span class="nav-badge">Kiosk</span>
          </button>

        <div class="sidebar-footer">
          <div class="user-profile-card" id="sidebarUserProfile">
            <div class="user-avatar" id="sidebarUserAvatar">A</div>
            <div class="user-info">
              <span class="user-name" id="sidebarUserName">Admin Sekolah</span>
              <span class="user-role-badge" id="sidebarUserRole">Super Admin</span>
            </div>
            <button class="apple-btn apple-btn-ghost" id="btnLogout" title="Keluar" style="padding: 0.3rem; color: var(--apple-text-tertiary);">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>

          </div>

        <header class="top-navbar">
          <div class="navbar-left">
            <div class="page-title-group">
              <h1 id="topNavTitle">Dashboard Eksekutif</h1>
            </div>
          </div>

          <div class="navbar-right">
            <!-- Sync Pill Real-Time -->
            <div class="sync-pill" id="syncStatusPill" title="Status Sinkronisasi Real-Time">
              <span class="sync-dot"></span>
              <span id="syncStatusText">Tersinkron Lokal (0 ms)</span>
            </div>

            <button class="apple-btn apple-btn-secondary" id="btnManualSync" style="font-size: 0.75rem; padding: 0.35rem 0.65rem;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
              Sinkronkan
            </button>

            <!-- Quick Role Switcher (Apple Segmented Style) -->
            <div class="apple-segmented-control" id="headerRoleSwitcher">
              <button class="segment-btn active" data-switch="admin">Admin</button>
              <button class="segment-btn" data-switch="tendik">Tendik</button>
              <button class="segment-btn" data-switch="guru">Guru</button>
            </div>

            <!-- Cloud Sync Modal Trigger (Supabase / Google Sheets) -->
            <button class="apple-btn apple-btn-secondary" id="btnCloudSync" title="Konfigurasi Sinkronisasi Cloud Sekolah (Multi-User)" style="font-size: 0.75rem; padding: 0.35rem 0.65rem; display: inline-flex; align-items: center; gap: 0.35rem; font-weight: 600;">

              <span>Cloud Sync</span>
            </button>

            <!-- Install PWA Button (Hidden by default, shown when eligible) -->
            <button class="apple-btn apple-btn-secondary" id="btnPwaInstall" title="Pasang Aplikasi ke Layar Utama (PWA)" style="display: none; font-size: 0.75rem; padding: 0.35rem 0.65rem; color: var(--apple-blue); font-weight: 700; align-items: center; gap: 0.35rem;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>

            </button>

            <button class="apple-btn apple-btn-secondary" id="btnSecurityCenter" title="Pusat Keamanan & Audit (20 Standar)" style="font-size: 0.75rem; padding: 0.35rem 0.65rem; display: inline-flex; align-items: center; gap: 0.35rem; color: var(--apple-blue); font-weight: 700;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>

            <button class="apple-btn apple-btn-ghost" id="btnThemeToggle" title="Ganti Mode Tampilan" style="padding: 0.4rem;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
